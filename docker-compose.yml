services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca} -d ${POSTGRES_DB:-biblioteca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biblioteca}:${POSTGRES_PASSWORD:-biblioteca}@db:5432/${POSTGRES_DB:-biblioteca}
      DIAS_PRESTAMO: ${DIAS_PRESTAMO:-14}
      MAX_PRESTAMOS_POR_SOCIO: ${MAX_PRESTAMOS_POR_SOCIO:-3}
      MULTA_ESTRATEGIA: ${MULTA_ESTRATEGIA:-diaria}
      MULTA_MONTO_DIA: ${MULTA_MONTO_DIA:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
      JWT_SECRET: ${JWT_SECRET:-cambiar-esta-clave-en-produccion}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@biblio.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
